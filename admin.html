<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - ULTRA TOP UP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif;background:#0a1931}.hide{display:none!important}</style>
</head>
<body class="p-4 text-white">

<div id="lockBox" class="max-w-sm mx-auto mt-20 bg-white text-black rounded-[20px] p-5 text-center">
<p class="font-black text-[20px]">👑 Admin Login</p>
<p class="text-[12px] text-gray-500 mt-1">শুধু তুমিই ঢুকতে পারবা ভাই</p>
<input id="adminPass" type="password" placeholder="Admin Password দাও" class="w-full border-2 p-3 rounded-xl mt-4 font-bold">
<button onclick="checkAdmin()" class="bg-black text-white w-full py-3.5 rounded-xl font-black mt-3">Login করো</button>
<p class="text-[11px] text-gray-400 mt-3">Password: Ultra@2026</p>
</div>

<div id="adminBox" class="hide max-w-2xl mx-auto">
<div class="flex justify-between items-center">
<p class="font-black text-[20px]">👑 ULTRA Admin Panel</p>
<button onclick="location.href='index.html'" class="bg-white text-black px-3 py-1.5 rounded-full text-[12px] font-black">Home</button>
</div>
<p class="text-[12px] opacity-70 mt-1">সব কাস্টমারের অর্ডার এখানে দেখবা</p>

<div class="grid grid-cols-3 gap-2 mt-4">
<div class="bg-white text-black rounded-xl p-3 text-center"><p class="font-black text-[20px]" id="totalOrder">0</p><p class="text-[11px]">মোট অর্ডার</p></div>
<div class="bg-green-400 text-black rounded-xl p-3 text-center"><p class="font-black text-[20px]" id="totalTk">0</p><p class="text-[11px]">মোট টাকা</p></div>
<div class="bg-yellow-400 text-black rounded-xl p-3 text-center"><p class="font-black text-[20px]" id="totalUser">0</p><p class="text-[11px]">মোট ইউজার</p></div>
</div>

<div id="orderList" class="mt-4 space-y-2"></div>
<button onclick="clearAll()" class="bg-red-500 w-full py-3 rounded-xl font-black mt-4">🗑️ সব ডিলিট করো</button>
</div>

<script>
function checkAdmin(){
  var p=document.getElementById('adminPass').value;
  if(p=='Ultra@2026'){
    document.getElementById('lockBox').classList.add('hide');
    document.getElementById('adminBox').classList.remove('hide');
    loadOrders();
  } else { alert('ভুল পাসওয়ার্ড ভাই!'); }
}
function loadOrders(){
  var orders=JSON.parse(localStorage.getItem('ultra_orders')||'[]');
  var users=JSON.parse(localStorage.getItem('ultra_users')||'[]');
  document.getElementById('totalOrder').innerText=orders.length;
  document.getElementById('totalUser').innerText=users.length;
  var total=0; orders.forEach(o=> total+=o.price);
  document.getElementById('totalTk').innerText=total+' Tk';
  var box=document.getElementById('orderList');
  if(orders.length==0){ box.innerHTML='<p class="bg-white text-black p-4 rounded-xl text-center">এখনো কোনো অর্ডার নাই ভাই</p>'; return; }
  box.innerHTML=orders.map((o,i)=>'<div class="bg-white text-black rounded-xl p-3"><p class="font-black">'+o.domain+' - '+o.price+' Tk</p><p class="text-[12px] text-gray-600">নাম: '+o.name+' | 📱 '+o.phone+'<br>পেমেন্ট: '+o.method+' | Trx: '+o.trx+'<br>তারিখ: '+o.date+' | <span class="text-green-600 font-black">● '+o.status+'</span></p></div>').join('');
}
function clearAll(){
  if(confirm('সব ডিলিট করবা ভাই?')){ localStorage.removeItem('ultra_orders'); loadOrders(); }
}
</script>
</body>
</html>
